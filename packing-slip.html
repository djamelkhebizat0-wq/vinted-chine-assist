<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bon de livraison — Vinted Chine Assist</title>
  <style>
    :root { font-family: "Segoe UI", system-ui, sans-serif; color: #142421; }
    body { margin: 24px; }
    h1 { font-size: 20px; }
    .muted { color: #5a716c; font-size: 13px; }
    .slip {
      border: 1px solid #cfe0dc;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      page-break-inside: avoid;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e4eeeb; }
    .actions { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    button, a.btn {
      background: #099a8e; color: #fff; border: none; border-radius: 8px;
      padding: 8px 12px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 13px;
    }
    a.ghost { background: #fff; color: #142421; border: 1px solid #cfe0dc; }
    @media print {
      .actions, .no-print { display: none !important; }
      body { margin: 0; }
    }
    @media (max-width: 600px) { body { margin: 12px; } }
  </style>
</head>
<body>
  <h1>Bons de livraison / emballage</h1>
  <p class="muted">Générés depuis le CRM local. Cochez la checklist d’emballage dans l’extension avant le dépôt.</p>
  <div class="actions no-print">
    <button type="button" id="btnPrint">Imprimer</button>
    <a class="btn ghost" href="crm.html">Retour CRM</a>
  </div>
  <div id="slips"></div>
  <script src="lib/shared.js"></script>
  <script>
    document.getElementById("btnPrint").addEventListener("click", () => window.print());
    (async () => {
      const all = await VCA.loadAll();
      const params = new URLSearchParams(location.search);
      const only = params.get("id");
      let items = all.crm.filter((i) => i.status === "sold" || only);
      if (only) items = all.crm.filter((i) => i.id === only);
      const packing = all.packing || [];
      const root = document.getElementById("slips");
      if (!items.length) {
        root.innerHTML = "<p>Aucun article vendu dans le CRM.</p>";
        return;
      }
      root.innerHTML = items.map((it) => {
        const fees = it.fees === "" || it.fees == null ? VCA.estimateFees(it.salePrice, all.settings) : it.fees;
        const net = VCA.netMargin({ ...it, fees }, all.settings);
        const checks = packing.map((p) => `<li>${p.done ? "☑" : "☐"} ${VCA.esc(p.label)}</li>`).join("");
        return `<article class="slip">
          <h2>${VCA.esc(it.title || "Article")}</h2>
          <p class="muted">${VCA.esc(it.listingUrl || "")}</p>
          <table>
            <tr><th>Achat</th><td>${VCA.formatEuro(it.purchasePrice)} €</td></tr>
            <tr><th>Vente</th><td>${VCA.formatEuro(it.salePrice)} €</td></tr>
            <tr><th>Frais estimés</th><td>${VCA.formatEuro(fees)} €</td></tr>
            <tr><th>Port</th><td>${VCA.formatEuro(it.shippingCost)} €</td></tr>
            <tr><th>Marge nette</th><td>${VCA.formatEuro(net)} €</td></tr>
            <tr><th>Vendu le</th><td>${VCA.esc(it.soldAt || "—")}</td></tr>
          </table>
          <h3>Checklist colis</h3>
          <ul>${checks}</ul>
        </article>`;
      }).join("");
    })();
  </script>
</body>
</html>
